# GuangDianItemLabel 配置文件
# 物品掉落标签系统

# 标签更新间隔 (tick)
update-interval: 20

# 孤儿标签扫描间隔（每 N 次 updateLabels 执行一次全量扫描）
# 默认 60 = 约 60 秒扫描一次，用于清理残留的 TextDisplay 实体
# 值越小扫描越频繁，但消耗更多性能
orphan-scan-interval: 60

# 标签显示设置
label:
  # 标签在物品上方的偏移量 (Y轴)
  offset-y: 0.8

  # 标签缩放比例
  scale: 0.8

  # 标签可见范围 (方块)
  view-range: 20

  # 是否显示物品数量
  show-amount: true

  # 物品掉落多少tick后显示标签
  # 20 tick = 1秒
  settle-ticks: 20
