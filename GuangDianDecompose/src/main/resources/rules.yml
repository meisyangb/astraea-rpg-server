# ─── 装备分解规则配置 ───
#
# 支持两种匹配方式:
# 1. 物品ID匹配 - 精确匹配 RPGItems 物品ID
# 2. 阶位匹配 - 从物品PDC读取Tier字段进行匹配
#
# 格式说明:
# ═══════════════════════════════════════════════════════════
# 物品ID匹配:
# 物品ID:
#   materials:        # 分解获得的材料
#     - "rpg:材料ID:数量"  # rpg: 表示RPGItems物品
#     - "vanilla:材料ID:数量"  # vanilla: 表示原版物品
#   chance: 1.0       # 分解成功率 (0.0-1.0)
#   message: ""       # 分解成功提示 (可选)
#
# 阶位匹配:
# tier-rules:
#   阶位名称:
#     pattern: "Tier值"   # 匹配物品的Tier字段值 (如 "1", "2", "3")
#     materials:
#       - "rpg:材料ID:数量"
#     chance: 1.0
#     message: ""       # (可选)
# ═══════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════
# 阶位分解规则 - 根据物品Tier字段匹配
# 优先级: 物品ID规则 > 阶位规则 > 默认规则
# ═══════════════════════════════════════════════════════════

tier-rules:
  一阶装备:
    pattern: "1"
    materials:
      - "rpg:一阶锻造精华:3"
      - "rpg:下级装备核心:1"
    chance: 1.0

  二阶装备:
    pattern: "2"
    materials:
      - "rpg:一阶锻造精华:2"
      - "rpg:二阶锻造精华:3"
      - "rpg:下级装备核心:1"
    chance: 1.0

  三阶装备:
    pattern: "3"
    materials:
      - "rpg:二阶锻造精华:2"
      - "rpg:三阶锻造精华:3"
      - "rpg:下级装备核心:1"
    chance: 1.0

  四阶装备:
    pattern: "4"
    materials:
      - "rpg:三阶锻造精华:2"
      - "rpg:四阶锻造精华:3"
      - "rpg:中级装备核心:1"
    chance: 1.0

  五阶装备:
    pattern: "5"
    materials:
      - "rpg:四阶锻造精华:2"
      - "rpg:五阶锻造精华:3"
      - "rpg:中级装备核心:1"
    chance: 1.0

  六阶装备:
    pattern: "6"
    materials:
      - "rpg:五阶锻造精华:3"
      - "rpg:天空碎片:3"
      - "rpg:上级装备核心:1"
    chance: 1.0

  魔王装备:
    pattern: "魔王"
    materials:
      - "rpg:四阶锻造材料:3"
      - "rpg:五阶锻造材料:3"
      - "rpg:魔王核心:1"
      - "rpg:中级装备核心:1"
    chance: 1.0
    message: "<dark_red>从魔王装备中提取了邪恶的力量！"

  天族装备:
    pattern: "天族"
    materials:
      - "rpg:天族宝具碎片:1"
    chance: 1.0
    message: "<aqua>从天族装备中提取了神圣的力量！"

# ═══════════════════════════════════════════════════════════
# 物品ID分解规则 - 精确匹配 RPGItems 物品ID
# ═══════════════════════════════════════════════════════════

