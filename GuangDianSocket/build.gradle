plugins {
    id 'java'
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    flatDir { dirs 'libs' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.6-R0.1-SNAPSHOT'
    compileOnly files('../RPGCore/build/libs/RPGCore-1.0.0.jar')
    compileOnly files('../RPGItems/build/libs/RPGItems-1.0.0.jar')
}

jar {
    archiveBaseName.set('GuangDianSocket')
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
