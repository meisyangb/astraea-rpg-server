<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Astraea RPG 插件文档</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="光点RPG服务器专属插件体系文档">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Docsify Theme - Using a modern theme -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  
  <!-- Custom Styles -->
  <style>
    /* ==================== */
    /* 全局变量定义           */
    /* ==================== */
    :root {
      --theme-color: #3498db;
      --theme-color-dark: #2980b9;
      --theme-color-light: #5dade2;
      --success-color: #27ae60;
      --warning-color: #f39c12;
      --danger-color: #e74c3c;
      --info-color: #3498db;
      --sidebar-width: 300px;
      --sidebar-width-small: 250px;
    }
    
    /* ==================== */
    /* 基础样式优化           */
    /* ==================== */
    body {
      font-family: -apple-system, "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #2c3e50;
      line-height: 1.6;
    }
    
    /* ==================== */
    /* 侧边栏优化            */
    /* ==================== */
    .sidebar {
      border-right: 1px solid #eaecef;
      background: #f6f8fa;
    }
    
    .sidebar-nav > ul > li > p {
      font-weight: 600;
      font-size: 14px;
      color: #2c3e50;
      margin-top: 20px;
      margin-bottom: 8px;
      padding-left: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .sidebar-nav li a {
      padding: 6px 20px;
      color: #3e4c5a;
      font-size: 14px;
      transition: all 0.2s;
    }
    
    .sidebar-nav li a:hover {
      color: var(--theme-color);
      background: rgba(52, 152, 219, 0.05);
    }
    
    .sidebar-nav li.active > a {
      color: var(--theme-color);
      border-right: 3px solid var(--theme-color);
      background: rgba(52, 152, 219, 0.1);
    }
    
    .app-name {
      padding: 20px 20px 10px;
      font-size: 20px;
      font-weight: 700;
      color: var(--theme-color);
      border-bottom: 1px solid #eaecef;
      margin-bottom: 10px;
    }
    
    .app-name-link {
      color: var(--theme-color) !important;
    }
    
    /* ==================== */
    /* 内容区域优化          */
    /* ==================== */
    .markdown-section {
      max-width: 900px;
      padding: 30px 40px;
    }
    
    .markdown-section h1 {
      font-size: 2.2em;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 2px solid #eaecef;
      color: #2c3e50;
    }
    
    .markdown-section h2 {
      font-size: 1.65em;
      margin-top: 40px;
      margin-bottom: 15px;
      padding-bottom: 8px;
      border-bottom: 1px solid #eaecef;
      color: #2c3e50;
    }
    
    .markdown-section h3 {
      font-size: 1.35em;
      margin-top: 30px;
      margin-bottom: 10px;
      color: #34495e;
    }
    
    .markdown-section h4 {
      font-size: 1.15em;
      margin-top: 20px;
      margin-bottom: 10px;
      color: #34495e;
    }
    
    /* ==================== */
    /* 链接样式             */
    /* ==================== */
    .markdown-section a {
      color: var(--theme-color);
      text-decoration: none;
      font-weight: 500;
    }
    
    .markdown-section a:hover {
      text-decoration: underline;
    }
    
    /* ==================== */
    /* 代码块优化           */
    /* ==================== */
    .markdown-section pre {
      background-color: #282c34;
      border-radius: 8px;
      padding: 20px;
      margin: 20px 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    .markdown-section pre > code {
      background-color: transparent;
      color: #abb2bf;
      font-size: 14px;
      line-height: 1.6;
    }
    
    .markdown-section code {
      background-color: #f0f4f8;
      border-radius: 4px;
      padding: 2px 6px;
      color: #e96900;
      font-size: 0.9em;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    }
    
    /* ==================== */
    /* 表格优化             */
    /* ==================== */
    .markdown-section table {
      border-collapse: collapse;
      width: 100%;
      margin: 20px 0;
      border: 1px solid #dfe2e5;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }
    
    .markdown-section table th {
      background-color: #f6f8fa;
      font-weight: 600;
      padding: 12px 16px;
      border-bottom: 2px solid #dfe2e5;
      color: #2c3e50;
    }
    
    .markdown-section table td {
      padding: 10px 16px;
      border-bottom: 1px solid #dfe2e5;
    }
    
    .markdown-section table tr:nth-child(even) {
      background-color: #fbfcfd;
    }
    
    .markdown-section table tr:hover {
      background-color: #f0f7ff;
    }
    
    /* ==================== */
    /* 引用块优化           */
    /* ==================== */
    .markdown-section blockquote {
      border-left: 4px solid var(--theme-color);
      background-color: #f0f7fb;
      padding: 12px 20px;
      margin: 20px 0;
      border-radius: 0 6px 6px 0;
      color: #5a6d7e;
    }
    
    .markdown-section blockquote p {
      margin: 8px 0;
    }
    
    /* ==================== */
    /* 提示框样式           */
    /* ==================== */
    .custom-block {
      border-radius: 6px;
      padding: 12px 20px;
      margin: 20px 0;
      border-left: 4px solid;
    }
    
    .custom-block.tip {
      background-color: #f3faf5;
      border-color: var(--success-color);
    }
    
    .custom-block.warning {
      background-color: #fffaf0;
      border-color: var(--warning-color);
    }
    
    .custom-block.danger {
      background-color: #fff5f5;
      border-color: var(--danger-color);
    }
    
    .custom-block.info {
      background-color: #f0f7fb;
      border-color: var(--info-color);
    }
    
    .custom-block-title {
      font-weight: 600;
      margin-bottom: 8px;
      display: block;
    }
    
    /* ==================== */
    /* 列表优化             */
    /* ==================== */
    .markdown-section ul, .markdown-section ol {
      padding-left: 25px;
    }
    
    .markdown-section li {
      margin: 8px 0;
    }
    
    /* ==================== */
    /* 徽章样式             */
    /* ==================== */
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      margin-left: 8px;
    }
    
    .badge.necessary {
      background-color: #ffeaea;
      color: var(--danger-color);
    }
    
    .badge.optional {
      background-color: #fff4e6;
      color: var(--warning-color);
    }
    
    /* ==================== */
    /* 响应式优化           */
    /* ==================== */
    @media screen and (max-width: 768px) {
      .markdown-section {
        padding: 20px;
      }
      
      .markdown-section h1 {
        font-size: 1.8em;
      }
      
      .markdown-section h2 {
        font-size: 1.4em;
      }
    }
    
    /* ==================== */
    /* 搜索框优化           */
    /* ==================== */
    .search {
      margin: 10px 20px;
    }
    
    .search input {
      border: 1px solid #dfe2e5;
      border-radius: 20px;
      padding: 8px 15px;
      width: 100%;
      transition: all 0.3s;
    }
    
    .search input:focus {
      border-color: var(--theme-color);
      box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
      outline: none;
    }
    
    /* ==================== */
    /* 分页导航优化         */
    /* ==================== */
    .pagination-item {
      border: 1px solid #eaecef;
      border-radius: 6px;
      padding: 10px 20px;
      transition: all 0.2s;
    }
    
    .pagination-item:hover {
      border-color: var(--theme-color);
      background: #f0f7fb;
    }
  </style>
</head>
<body>
  <div id="app">加载中...</div>
  
  <script>
    window.$docsify = {
      name: 'Astraea RPG 插件文档',
      repo: '',
      loadSidebar: '_sidebar.md',
      subMaxLevel: 3,
      auto2top: true,
      coverpage: false,
      notFoundPage: true,
      
      // 搜索配置
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '搜索文档...',
        noData: '没有找到结果',
        depth: 6,
        hideOtherSidebarContent: true
      },
      
      // 分页导航
      pagination: {
        previousText: '上一章节',
        nextText: '下一章节',
        crossChapter: true,
        crossChapterText: true,
      },
      
      // 字数统计
      count: {
        countable: true,
        fontsize: '0.9em',
        color: 'rgb(90,90,90)',
        language: 'chinese'
      },
      
      // 代码高亮
      markdown: {
        smartypants: true,
        breaks: true,
        linkify: true
      },
      
      // 主题颜色
      themeColor: '#3498db',
      
      // 别名
      alias: {
        '/.*/': '/'
      }
    }
  </script>
  
  <!-- Docsify 核心 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  
  <!-- 搜索插件 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  
  <!-- 代码高亮 -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-java.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-xml-doc.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>
  
  <!-- 外部链接插件 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/external-script.min.js"></script>
  
  <!-- 分页导航插件 -->
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  
  <!-- 字数统计插件 -->
  <script src="//cdn.jsdelivr.net/npm/docsify-count@latest/dist/countable.min.js"></script>
  
  <!-- Emoji 支持 -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/emoji.min.js"></script>
  
  <!-- 复制代码插件 -->
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2/dist/docsify-copy-code.min.js"></script>
  
  <!-- 图片缩放插件 -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  
  <!-- 标签页插件 (支持多个代码块切换) -->
  <script src="//cdn.jsdelivr.net/npm/docsify-tabs@1/dist/docsify-tabs.min.js"></script>
</body>
</html>
