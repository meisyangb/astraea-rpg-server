# ========================================
# GuangDianDynamicView 配置文件
# 动态视距插件 - 按世界配置挡位模式
# ========================================
#
# 设计思路：
#   不同世界类型的视距需求完全不同
#   副本空间小，不需要高视距
#   主城要美观，但挂机浪费资源
#   所以每个世界单独配置各挡位的视距值
#
# 挡位说明：
#   exploring - 跑图/探索（玩家正常活动时的默认状态）
#   combat    - 战斗（攻击或受击后进入，持续一段时间）
#   afk       - 挂机（长时间无移动）
#
# ========================================

settings:
  enabled: true
  debug: false

# ========================================
# 全局默认挡位视距
# 未单独配置的世界会使用这里的值
# ========================================
default-tiers:
  exploring: 5
  combat: 3
  afk: 3

# ========================================
# 战斗检测
# ========================================
combat:
  # 战斗状态持续时间（秒）
  duration: 10

# ========================================
# 挂机检测
# ========================================
afk:
  # 挂机判定时间（秒）
  timeout: 30

# ========================================
# 视距更新间隔（tick，20tick=1秒）
# ========================================
update-interval: 20

# ========================================
# 渐进式调整配置
# 避免视距跳变导致的闪烁
# ========================================
gradual-adjust:
  # 是否启用渐进式调整
  # true: 每次只调整1格视距，平滑过渡
  # false: 直接跳变到目标视距（可能闪烁）
  enabled: true
  # 每次调整之间的间隔（毫秒）
  # 值越大越平滑，但调整完成需要更长时间
  # 推荐 300-800ms
  interval: 500

# ========================================
# 世界配置
# ========================================
# 每个世界可以：
#   1. 用 fixed 视距（不随状态变化，适合副本）
#   2. 用各挡位视距（随状态动态切换）
#   3. 不配置则使用 default-tiers 的值
#
# 世界名匹配规则：
#   精确匹配世界名，支持前缀匹配
#   例如 dungeon_开头的世界都匹配 dungeon_
# ========================================
worlds:
  # ---- 主城 ----
  # 美观优先，但挂机时大幅降低省资源
  spawn:
    exploring: 6
    combat: 6
    afk: 3

  # ---- 副本世界 ----
  # 封闭空间，固定3视距足够，省资源
  # dungeon_ 开头的世界名都会匹配
  dungeon_:
    fixed: 3

  # ---- PVP世界 ----
  # 战斗为主，跑图也不需要太远
  pvp:
    exploring: 4
    combat: 3
    afk: 3

  # ---- 资源世界 ----
  # 跑图需要视野找矿，战斗时降低
  resource:
    exploring: 5
    combat: 3
    afk: 3

  # ---- 活动世界 ----
  # 活动通常人多，适当降低
  event:
    exploring: 4
    combat: 3
    afk: 3

# ========================================
# 消息配置
# ========================================
messages:
  enabled: false
  use-actionbar: true
  text:
    afk: "&e[动态视距] &f检测到挂机，视距已降低"
    combat: "&c[动态视距] &f战斗状态，视距已调整"
    exploring: "&a[动态视距] &f跑图模式，视距已恢复"
