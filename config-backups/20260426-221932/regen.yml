# ========================================
# 生命恢复配置
# ========================================
# 控制"每秒回血"属性的生效方式
# ========================================

# 回血间隔 (tick, 20tick=1秒)
interval: 20

# 战斗中是否允许回血
combat_regen: true

# 战斗中回血倍率
# 0.5 = 战斗中回血效果减半
combat_multiplier: 0.5

# 战斗状态超时 (毫秒)
# 受伤后这么多毫秒内算战斗状态
combat_timeout: 5000