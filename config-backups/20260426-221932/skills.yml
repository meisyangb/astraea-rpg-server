# ========================================
# 技能配置 (工业级重构)
# ========================================
# 定义装备上的技能
#
# 技能类型 (type):
#   - active: 主动技能 (右键触发)
#   - damage_trigger: 被动技能 (攻击时有几率触发)
#   - on_hit: 被击中时触发
#   - passive: 被动技能 (持续生效)
#
# 技能属性:
#   - trigger_chance: 触发概率 (0-100)
#   - range: 技能范围 (格)
#   - damage_mult: 伤害倍率 (相对于攻击力)
#   - cooldown: 冷却时间 (秒)
#   - effect: 特效类型 (fire/lightning/ice/poison/heal/explosion/magic)
#   - duration: 持续时间 (秒, 用于DOT和状态效果)
#   - heal_percent: 治疗百分比 (0-100, 基于最大生命值)
#   - status_effects: 状态效果列表 (poison/slowness/blindness/weakness/wither等)
#   - mana_cost: 法力消耗 (预留)
#   - true_damage: 是否真实伤害 (无视防御)
#   - pvp_only: 是否仅PVP生效
#   - dot: 是否持续伤害 (需要duration)
#
# 技能分层:
#   - 新手级: 低伤害/低冷却, 1-20级装备
#   - 进阶级: 中伤害/中冷却, 20-50级装备
#   - 传说级: 高伤害/长冷却, 50+级装备
#   - 神话级: 极高伤害/超长冷却, 终极装备
# ========================================

