enhance:
  # 全局默认最大强化等级 (Tier未配置时使用)
  max_level: 15
  
  # 各阶位最高强化等级 (Tier: max_level)
  tier_max_level:
    1: 5
    2: 7
    3: 8
    4: 10
    5: 12
    6: 14
    7: 15
  
  # 【枚举法】每个强化等级对应的固定属性倍率
  # 强化时直接读取对应倍率，降级时强制同步到对应倍率
  # 格式: 等级: 倍率 (例如 5: 1.5 表示+5级属性是基础属性的1.5倍)
  level_multipliers:
    1: 1.05
    2: 1.10
    3: 1.15
    4: 1.20
    5: 1.30
    6: 1.40
    7: 1.55
    8: 1.70
    9: 1.90
    10: 2.10
    11: 2.35
    12: 2.65
    13: 3.00
    14: 3.40
    15: 4.00
  
  success_rate:
    base: 1.0
    decay_factor: 0.05
    min_rate: 0.01
  
  failure:
    type: degrade
    degrade_chance: 0.5
    destroy_chance: 0.0
  
  materials:
    "1-5":
      - "DIAMOND:1"
    "6-10":
      - "DIAMOND:3"
      - "EMERALD:1"
    "11-15":
      - "DIAMOND:5"
      - "EMERALD:3"
      - "NETHERITE_INGOT:1"
  
  money_cost:
    base: 0
    multiplier: 1.5
  
  protection_charm:
    enabled: true
    item: "NETHER_STAR"
    consume_on_fail: true
  
  cooldown_ms: 500
  
  pity:
    enabled: true
    threshold: 10
    bonus_per_fail: 0.05
    max_bonus: 0.5
