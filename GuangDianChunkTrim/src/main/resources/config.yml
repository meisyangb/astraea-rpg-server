# ========================================
# GuangDianChunkTrim 配置文件
# 区块裁剪插件
# ========================================

# ========================================
# 默认设置
# ========================================
defaults:
  # 默认保留半径（格）
  radius: 100

# ========================================
# 性能设置
# ========================================
performance:
  # 每秒处理区块数（建议20以下，防止卡顿）
  chunks-per-second: 20
  
  # 边界缓冲区（区块）
  # 保留区域外的额外缓冲区块
  buffer-size: 16

# ========================================
# 安全设置
# ========================================
safety:
  # 是否需要确认才能执行裁剪
  confirm-required: true
  
  # 警告提示
  show-warning: true

# ========================================
# 消息设置
# ========================================
messages:
  prefix: "&6[区块裁剪] &r"
  no-permission: "&c没有权限!"
  world-not-found: "&c世界不存在!"
  task-running: "&c这个世界已有裁剪任务运行!"
  task-started: "&a裁剪任务已启动!"
  task-paused: "&e裁剪任务已暂停!"
  task-continued: "&a裁剪任务已继续!"
  task-cancelled: "&c裁剪任务已取消!"
  task-completed: "&a裁剪任务完成!"