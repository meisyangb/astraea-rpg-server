# Astraea RPG 职业系统配置

settings:
  default-class: "novice"
  max-tier: 9
  auto-save-interval-minutes: 5

  exp-sources:
    monster-kill:
      enabled: true
      base-exp: 15
      base-level: 1
      # 特定怪物经验配置（可选，不配置则使用 base-exp）
      mob-exp:
        # 第一章：灰烬平原（1-10级）
        corruptedrat: 8
        corruptedbat: 6
        ashspiderling: 10
        corruptedboar: 12
        ashwanderer: 15
        corruptedwolf: 18
        ashscout: 20
        corruptedgiantrat: 50
        ruinsspider: 22
        ruinsguard: 28
        ashwarlock: 35
        ashchieftain: 100
      # 怪物等级配置（用于等级差惩罚）
      mob-level:
        # 第一章：灰烬平原（1-10级）
        corruptedrat: 1
        corruptedbat: 1
        ashspiderling: 2
        corruptedboar: 2
        ashwanderer: 3
        corruptedwolf: 3
        ashscout: 4
        corruptedgiantrat: 5
        ruinsspider: 5
        ruinsguard: 6
        ashwarlock: 7
        ashchieftain: 8
    quest-complete:
      enabled: true
      base-exp: 100
    block-break:
      enabled: false
      base-exp: 1
    afk:
      enabled: true
      exp-per-minute: 1
      message-enabled: true
    # 每日经验上限
    daily-limit:
      enabled: true
      # 每日职业经验上限（击杀怪物获取）
      class-exp: 1000
      # 每日原版经验上限（附魔、熔炉等）
      vanilla-exp: 500

tier-exp-requirements:
  1: 0
  2: 500
  3: 1500
  4: 4000
  5: 8000
  6: 15000
  7: 30000
  8: 60000
  9: 120000

