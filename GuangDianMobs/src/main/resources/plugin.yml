name: GuangDianMobs
version: 2.0.0
main: cn.guangdian.mobs.GuangDianMobs
api-version: '1.21'
author: GuangDian
description: 光点自定义怪物系统 v2.0

dependencies:
  server:
    RPGCore:
      load: BEFORE
      required: true
    RPGItems:
      load: AFTER
      required: false

softdepend:
  - PlaceholderAPI

commands:
  gdmm:
    description: GuangDianMobs 管理命令
    usage: /gdmm <spawn/kill/reload/list>
    permission: gdmm.admin

permissions:
  gdmm.admin:
    default: op
  gdmm.spawn:
    default: op
  gdmm.kill:
    default: op
  gdmm.reload:
    default: op
  gdmm.list:
    default: op
