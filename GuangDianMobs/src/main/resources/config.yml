# GuangDianMobs 配置文件
# 版本: 1.0.0

# 调试模式
debug: false

# 全局设置
global:
  auto-spawn: true
  spawn-check-interval: 60
  max-mobs-per-chunk: 10
  despawn-distance: 128

# 掉落设置
drops:
  enabled: true
  multiplier: 1.0
  mythic-mobs-integration: true

# 技能设置
skills:
  enabled: true
  cast-interval: 100

# 消息设置
messages:
  mob-spawned: "<gray>怪物 <yellow>%mob% <gray>已生成"
  mob-killed: "<gray>你击杀了 <yellow>%mob%<gray>!"

# 仇恨系统设置（已合并 GuangDianAggro）
aggro:
  enabled: true
  
  decay:
    rate: 0.05
    interval: 60
  
  threshold:
    min: 1.0
  
  multiplier:
    damage: 1.0
    heal: 0.5
    distance: 0.1
  
  limits:
    max_targets: 10
  
  mythicmobs:
    only: false
    integrate_threat_table: true
