# ========================================
# 任务线配置 - 支持门派独立主线
# ========================================
# 
# sect 字段说明:
#   null 或不写 = 所有门派通用
#   "guiwang" = 仅鬼王宗弟子可见
#   "qingyun" = 仅青云宗弟子可见
#   等等...
#
# 使用方式:
#   每个门派的主线任务按 order 顺序自动解锁
#   questline 字段相同的任务属于同一任务线
# ========================================

questlines:
  # ========== 通用主线（无门派时显示） ==========
  main_story:
    name: "<gold>主线剧情"
    description: "未加入门派时的新手引导"
    sect: null
    quests:
      - main_001
      - main_002
      - main_003
    chapters:
      - "<yellow>第一章：初入修仙界"
      - "<yellow>第二章：拜入宗门"
      - "<yellow>第三章：宗门试炼"

  # ========== 鬼王宗主线 ==========
