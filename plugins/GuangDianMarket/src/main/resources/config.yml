# ================================
# GuangDianMarket 全球市场配置
# ================================

# 双货币配置
currency:
  # 点券设置
  points:
    enabled: true
    name: "点券"
    symbol: "💎"
  # 经济设置 (需要Vault和前置经济插件)
  economy:
    enabled: true
    name: "金币"
    symbol: "金币"

# 市场设置
settings:
  transaction-fee: 0        # 固定手续费
  fee-percent: 5.0          # 百分比手续费 (%)
  max-listings-per-player: 10  # 每人最大上架数量
  listing-duration-hours: 168  # 上架持续时间 (小时)
  items-per-page: 45        # 每页显示数量

# 消息配置
messages:
  insufficient-funds: "&c%currency%不足!"
  invalid-price: "&c无效的价格!"
  no-item-in-hand: "&c请手持要出售的物品!"
  max-listings-reached: "&c你已达到最大上架数量 (&6%max%&c)!"
  item-listed: "&a成功上架物品! 价格: &6%price% %currency%"
  item-sold: "&a你的物品已售出! 获得 &6%price% %currency%"
  purchase-success: "&a购买成功! 花费 &6%price% %currency%"
  cannot-buy-own: "&c不能购买自己的物品!"
  not-your-item: "&c这不是你的物品!"
  listing-cancelled: "&a已取消上架，物品已返还!"
  item-expired: "&c你的市场物品已过期并已返还!"
  no-permission: "&c你没有权限使用市场!"

# GUI配置
gui:
  market-title: "&6全球市场 &7- 第 %page% 页"
  my-listings-title: "&6我的上架"
  prev-page: "&a上一页"
  next-page: "&c下一页"
  current-page: "&e当前页: %page%/%total%"
  my-listings: "&6我的上架"
  balance-display: "&e点券: %points% &7| &e金币: %economy%"
  price-display: "&e价格: &6%price% %currency%"
  seller-display: "&7卖家: &f%seller%"
  time-remaining: "&7剩余时间: &f%time%"
  click-to-buy: "&a点击购买"
  click-to-cancel: "&c点击下架"

# 音效配置
sounds:
  purchase-success: "ENTITY_PLAYER_LEVELUP"
  purchase-fail: "ENTITY_VILLAGER_NO"
  listing-success: "BLOCK_NOTE_BLOCK_PLING"