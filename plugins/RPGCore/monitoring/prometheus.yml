# RPGCore Prometheus 监控配置
# 
# 将此配置添加到 prometheus.yml 的 scrape_configs 部分

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # RPGCore 监控任务
  - job_name: 'rpgcore'
    scrape_interval: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['localhost:8080']
        labels:
          server: 'astraea-rpg'
          environment: 'production'

# 告警规则配置
rule_files:
  - 'rpgcore_alerts.yml'

# Alertmanager 配置（可选）
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['localhost:9093']
