# RPGCore 核心配置
# 版本: 2.0.0
# 最后更新: 2026-04-25

# ==================== 数据库配置 ====================
# 安全提示：建议使用环境变量 RPGCORE_DB_USERNAME 和 RPGCORE_DB_PASSWORD 存储数据库凭证
# 而不是明文写在配置文件中。环境变量优先级高于配置文件。
database:
  # 是否启用数据库
  enabled: true

  # JDBC 连接 URL
  url: 'jdbc:mysql://localhost:3306/mc_rpg?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true'

  # 数据库用户名（如设置环境变量 RPGCORE_DB_USERNAME 则优先使用环境变量）
  username: "root"

  # 数据库密码（如设置环境变量 RPGCORE_DB_PASSWORD 则优先使用环境变量）
  password: "123456"

  # 连接池配置
  pool:
    # 最大连接数（所有插件共享）
    max-size: 20

    # 最小空闲连接数
    min-idle: 2

    # 连接超时时间（毫秒）
    connection-timeout: 30000

    # 空闲连接超时时间（毫秒）
    idle-timeout: 600000

    # 连接最大生命周期（毫秒）
    max-lifetime: 1800000

    # 是否启用连接泄漏检测
    leak-detection-threshold: 60000

    # 连接测试查询
    connection-test-query: "SELECT 1"

# ==================== 异步执行器配置 ====================
async:
  # 异步线程池大小
  # 建议设置为 CPU 核心数的 2-4 倍
  thread-pool-size: 4

  # 线程池队列容量（0表示无界队列）
  queue-capacity: 1000

  # 线程保活时间（秒）
  keep-alive-seconds: 60

  # 是否允许核心线程超时
  allow-core-thread-timeout: false

  # 线程名称前缀
  thread-name-prefix: "RPGCore-Async-"

# ==================== 缓存配置 ====================
cache:
  # 缓存模式
  # - CAFFEINE: Caffeine 高性能缓存（推荐，适用于所有规模服务器）
  mode: CAFFEINE

  # 缓存最大容量
  max-size: 2000

  # 默认缓存过期时间（分钟）
  default-ttl-minutes: 30

  # 是否启用统计信息收集
  record-stats: true

  # 是否启用弱引用键（有助于垃圾回收，但可能导致缓存意外失效）
  # 警告：启用后，当 JVM 进行垃圾回收时，缓存可能被清空
  # 生产环境建议保持 false，除非遇到内存压力问题
  weak-keys: false

  # 是否启用弱引用值（同上，值可能被 GC 回收）
  # 警告：数据可能在 TTL 之前就被回收，导致缓存命中率降低
  weak-values: false

  # 是否启用软引用值（内存不足时优先回收，比弱引用更温和）
  # 警告：在内存紧张时，软引用值会被优先回收
  # 适用于读多写少且允许丢失的缓存场景
  soft-values: false

  # 刷新间隔（分钟，0表示不自动刷新）
  refresh-interval-minutes: 0

# ==================== 事件发布器配置 ====================
event-publisher:
  # 是否启用性能监控
  performance-monitoring: true

  # 事件频率限制（每秒最大事件数，0表示不限制）
  rate-limit: 100

  # 性能警告阈值（毫秒）
  warning-threshold-ms: 10

  # 严重性能警告阈值（毫秒）
  critical-threshold-ms: 50

# ==================== 并发控制配置 ====================
lock:
  # 锁获取超时时间（毫秒）
  timeout-ms: 3000

# ==================== 监控配置 ====================
monitor:
  # 是否启用性能监控
  enabled: true

  # 监控数据保留时间（分钟）
  retention-minutes: 60

  # 性能报告输出间隔（分钟，0表示不自动输出）
  report-interval-minutes: 30

  # 是否启用内存监控
  memory-monitoring: true

  # 内存警告阈值（MB）
  memory-warning-threshold-mb: 1024

  # 是否启用TPS监控
  tps-monitoring: true

  # TPS警告阈值
  tps-warning-threshold: 18.0

  # 是否记录慢操作（超过阈值的操作）
  log-slow-operations: true

  # 慢操作阈值（毫秒）
  slow-operation-threshold-ms: 100

# ==================== 调试配置 ====================
debug:
  # 是否启用调试模式
  enabled: false

  # 是否记录详细日志
  verbose: false

# ==================== 版本信息 ====================
version: "2.0.0"
