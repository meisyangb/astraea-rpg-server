name: GuangDianItemTrigger
version: 1.0.0
main: cn.guangdian.trigger.GuangDianItemTrigger
api-version: '1.21'
author: Gumin
description: 光点RPG物品触发插件 - 通过物品描述触发各种动作
website: www.guangdianrpg.com

# 插件依赖 (通过PlaceholderAPI获取其他插件数据)
softdepend:
  - PlaceholderAPI
  - RPGCore
  - GuangDianArmorStats

commands:
  gdtrigger:
    description: 物品触发插件管理命令
    usage: /gdtrigger <reload|info|help>
    aliases: [gdt, itemtrigger]

permissions:
  guangdian.trigger.use:
    description: 使用物品触发权限
    default: true
  guangdian.trigger.admin:
    description: 管理员权限
    default: op
  guangdian.trigger.reload:
    description: 重载配置权限
    default: op
