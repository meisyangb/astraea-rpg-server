# GuangDianName 配置文件
# 玩家头顶显示插件 - 全TextDisplay版本
# 使用 MiniMessage 格式 (<color> 替代 §)
#
# 显示层级（从下到上，靠近头部）：
# - 第1行：血量
# - 第2行：称号 + 玩家名 + 婚姻
# - 第3行：工会

# ==================== 显示总开关 ====================
display:
  # 是否启用显示
  enabled: true
  
  # 是否启用血量显示
  health-enabled: true
  # 是否启用称号显示
  title-enabled: true
  # 是否启用工会显示
  guild-enabled: true
  
  # 默认显示设置
  default-show-title: true
  default-show-guild: true
  default-show-marriage: true
  default-show-health: true
  
  # 血量显示格式 (%d 会被替换为血量值)
  # 使用 MiniMessage 格式
  health-format: "<red>❤ %d"
  
  # 称号+玩家名+婚姻显示格式
  # 使用 MiniMessage 格式
  
  # 婚姻显示格式 (%s 会被替换为伴侣名)
  marriage-format: "<light_purple> ♥%s"
  
  # 工会显示格式 (%s 会被替换为工会名)
  guild-format: "<dark_aqua>[%s]"
  
  # 显示高度设置（相对于玩家头部的偏移，单位：格）
  # 数值越小越靠近头部
  health-height: 0.3
  title-height: 0.6
  guild-height: 0.9

# ==================== 调试设置 ====================
debug: false
