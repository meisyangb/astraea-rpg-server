# GuangDianCaveFu 配置文件
# 光点RPG空岛洞府插件

# 洞府世界设置
world:
  name: "CaveFuWorld"
  view-distance: 2        # 洞府内视距（chunks）
  grid-size: 48           # 洞府间隔（格）
  base-y: 64              # 基础Y轴高度
  platform-block: BEDROCK # 平台底层方块
  surface-block: GRASS_BLOCK # 平台表面方块（草坪）

# 消息配置
messages:
  prefix: "&6[洞府] &f"
  no-permission: "&c你没有权限执行此操作！"
  cave-created: "&a洞府创建成功！"
  cave-full: "&c洞府空间已满，请联系管理员！"
  already-have-cave: "&c你已经拥有洞府了！"
  no-cave: "&c你还没有洞府！"
  upgrade-success: "&a洞府升级成功！当前等级: &e{level} &a- &e{name}"
  upgrade-failed: "&c升级失败，材料不足！"
  upgrade-max: "&c已经是最高等级，无法继续升级！"
  invite-sent: "&a已向 &e{player} &a发送邀请！"
  invite-received: "&e{player} &a邀请你加入洞府，输入 &e/cave accept &a接受"
  invite-none: "&c没有待处理的邀请！"
  invite-accepted: "&a已加入洞府！"
  invite-denied: "&c已拒绝邀请！"
  not-owner: "&c你不是洞主！"
  player-not-member: "&c该玩家不是你的洞府成员！"
  player-not-online: "&c玩家不在线！"
  player-already-member: "&c该玩家已经是洞府成员！"
  player-already-in-cave: "&c该玩家已拥有洞府！"
  member-kicked: "&c你已被移出洞府！"
  member-joined: "&e{player} &a加入了洞府！"
  member-left: "&e{player} &c离开了洞府！"
  transfer-success: "&a已将洞主转让给 &e{player}&a！"
  home-set: "&a传送点已设置！"
  teleporting: "&a正在传送..."
  not-in-cave: "&c你不在任何洞府内！"
  target-no-cave: "&c该玩家没有洞府！"
  cave-deleted: "&c洞府已被删除！"
  visitor-allowed: "&a该洞府允许访客进入，但无法操作！"
  visitor-denied: "&c该洞府不允许访客进入！"

# 初始设置
settings:
  default-level: 1        # 初始等级
  max-members: 10         # 最大成员数
  allow-visitor: true     # 是否允许访客进入参观
  create-cost: ""         # 创建洞府消耗（留空免费），格式同升级物品