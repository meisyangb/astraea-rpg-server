rewards:
  weapons_complete:
    name: "§c武器大师"
    description: "收集所有武器"
    condition:
      type: CATEGORY_COMPLETE
      category: weapons
    rewards:
      money: 10000
      points: 500
      commands:
        - "give {player} diamond_sword 1"
        - "exp add {player} 1000"
      messages:
        - "§6恭喜你成为武器大师!"

  armor_complete:
    name: "§9护甲大师"
    description: "收集所有护甲"
    condition:
      type: CATEGORY_COMPLETE
      category: armor
    rewards:
      money: 8000
      points: 400
      commands:
        - "give {player} diamond_chestplate 1"

  materials_complete:
    name: "§e材料收集者"
    description: "收集所有材料"
    condition:
      type: CATEGORY_COMPLETE
      category: materials
    rewards:
      money: 5000
      points: 300

  mobs_complete:
    name: "§4怪物猎人"
    description: "完成所有击杀目标"
    condition:
      type: CATEGORY_COMPLETE
      category: mobs
    rewards:
      money: 20000
      points: 1000
      commands:
        - "give {player} nether_star 5"
      messages:
        - "§6你已成为传说中的怪物猎人!"

  first_item:
    name: "§a初次收集"
    description: "收集第一件物品"
    condition:
      type: ITEM_COUNT
      count: 1
    rewards:
      money: 100
      points: 10
      messages:
        - "§a恭喜收集到第一件物品!"

  ten_items:
    name: "§b收集达人"
    description: "收集10件物品"
    condition:
      type: ITEM_COUNT
      count: 10
    rewards:
      money: 1000
      points: 100

  hundred_kills:
    name: "§c百人斩"
    description: "累计击杀100只怪物"
    condition:
      type: KILL_COUNT
      count: 100
    rewards:
      money: 2000
      points: 200

  thousand_kills:
    name: "§5千人斩"
    description: "累计击杀1000只怪物"
    condition:
      type: KILL_COUNT
      count: 1000
    rewards:
      money: 10000
      points: 500
      commands:
        - "give {player} diamond 10"
