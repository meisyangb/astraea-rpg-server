# ========================================
# GuangDianLocation 配置文件
# ========================================

# 基本设置
settings:
  # 每个玩家最多保存的坐标点数量
  max-locations-per-player: 50

  # 选点效果配置
  selection:
    # 粒子效果
    particle:
      enabled: true
      type: END_ROD
    # 音效
    sound:
      enabled: true
      type: BLOCK_NOTE_BLOCK_PLING

# 数据库配置
database:
  # 是否使用 RPGCore 共享连接池
  # 如果 RPGCore 已配置数据库，建议启用此选项
  use-rpgcore-pool: true

  # 如果不使用 RPGCore 连接池，请配置以下参数
  # 注意：独立连接池暂不支持，请确保 RPGCore 数据库已配置
  # url: jdbc:mysql://localhost:3306/guangdian_location?useSSL=false&serverTimezone=Asia/Shanghai<red>haracterEncoding=utf8
  # username: root
  # password: 123456

# 消息配置（可选自定义）
messages:
  selection-prompt: "<green>请在聊天栏输入坐标名称（30秒内有效）"
  selection-success: "<green>成功保存坐标点 <yellow>{name} <green>!"
  selection-cancelled: "<yellow>已取消本次坐标选择."
  location-not-found: "<red>坐标点 <yellow>{name} <red>不存在!"
  teleport-success: "<green>已传送到坐标点 <yellow>{name} <green>!"