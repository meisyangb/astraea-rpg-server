# GuangDianMonthlyCard - 月卡类型配置

# ==================== 普通月卡 ====================
normal:
  name: "<yellow>普通月卡"
  description: "<gray>基础月卡，每日领取点券奖励"
  duration: 30                     # 持续时间(天)
  price: 1000
  currency: "points"               # points/money
  
  # 每日奖励
  daily:
    points: 50
    money: 0
    items: []
    commands: []
  
  # 特权加成
  boost:
    exp: 1.1                       # 经验加成(1.1 = +10%)
    drop: 1.05                     # 掉落加成
  
  # 累计奖励
  milestones:
    7:
      points: 200
      money: 500
      commands: []
    14:
      points: 500
      money: 1500
      commands: []
    21:
      points: 1000
      money: 3000
      commands: []
    30:
      points: 2000
      money: 8000
      commands: []

