# GuangDianMonthlyCard - 主配置文件
# 仅包含核心设置，其他配置见独立文件

# ==================== 基础设置 ====================
settings:
  auto-save-interval: 300          # 自动保存间隔(秒)
  check-expired-interval: 1800     # 检查过期间隔(秒)
  timezone: "Asia/Shanghai"        # 时区设置

# ==================== 功能开关 ====================
features:
  makeup: true                     # 补签功能
  auto-renew: true                 # 自动续期
  milestone-rewards: true          # 累计奖励
  exp-boost: true                  # 经验加成
  drop-boost: true                 # 掉落加成

# ==================== 数据库设置 ====================
database:
  type: "sqlite"                   # sqlite/mysql
  mysql:
    host: "localhost"
    port: 3306
    database: "monthlycard"
    username: "root"
    password: "password"
    pool-size: 10

# ==================== 子配置文件路径 ====================
config-files:
  cards: "cards.yml"               # 月卡类型配置
  messages: "messages.yml"         # 消息配置
  gui: "gui.yml"                   # GUI配置
  makeup: "makeup.yml"             # 补签配置
  auto-renew: "auto-renew.yml"     # 自动续期配置
