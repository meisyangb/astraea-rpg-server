# GuangDianMobs 配置文件
# 版本: 1.0.0

# 调试模式
debug: false

# 全局设置
global:
  auto-spawn: true
  spawn-check-interval: 60
  max-mobs-per-chunk: 10
  despawn-distance: 128

# 掉落设置
drops:
  enabled: true
  multiplier: 1.0
  mythic-mobs-integration: true

# 技能设置
skills:
  enabled: true
  cast-interval: 100

# 消息设置
messages:
  mob-spawned: "<gray>怪物 <yellow>%mob% <gray>已生成"
  mob-killed: "<gray>你击杀了 <yellow>%mob%<gray>!"
