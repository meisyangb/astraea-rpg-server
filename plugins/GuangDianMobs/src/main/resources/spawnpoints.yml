# GuangDianMobs 刷新点配置
#
# 刷新点系统参考 MythicMobs 的 Spawners 和 RandomSpawns
# 允许在固定位置设置怪物刷新点，支持定时刷新和条件判断
#
# 配置说明:
# - mob: 怪物ID (必需)
# - level: 怪物等级 (-1 使用模板默认等级)
# - amount: 每次刷新数量
# - max-mobs: 最大同时存在数量
# - cooldown: 刷新冷却时间 (tick, 20 tick = 1秒)
# - radius: 刷新半径 (在指定范围内随机位置生成)
# - use-timer: 是否使用定时自动刷新
# - timer-interval: 定时刷新间隔 (tick)
# - require-player: 是否需要玩家在附近才刷新
# - player-range: 玩家检测范围
# - enabled: 是否启用

spawnpoints:
  # ============================================
  # 新手村刷新点
  # ============================================

  newbie_zombie_spawner:
    world: world
    x: 100.0
    y: 64.0
    z: 100.0
    yaw: 0.0
    pitch: 0.0
    display-name: "<gray>新手村僵尸刷新点"
    mob: weak_zombie
    level: 1
    amount: 2
    max-mobs: 6
    cooldown: 200        # 10秒冷却
    radius: 10.0
    use-timer: true
    timer-interval: 400  # 20秒检查一次
    require-player: true
    player-range: 50.0
    enabled: true

