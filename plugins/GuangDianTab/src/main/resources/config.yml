# ========================================
# 光点Tab列表插件配置文件
# GuangDianTab Configuration
# ========================================
# 作者: Gumin
# QQ: 2271257344
# 版本: 2.0.0
# ========================================

# ========================================
# 基础设置
# ========================================
enabled: true

# 刷新间隔 (毫秒) - 建议根据玩家数量调整
# 100人以下服务器建议 2000-3000ms
# 100人以上服务器建议 3000-5000ms
refresh-interval: 2000

# ========================================
# 按需刷新机制
# ========================================
use-lazy-refresh: true
lazy-refresh-interval: 5000

# ========================================
# 权限组数据缓存
# ========================================
cache:
  expire-ms: 30000

# ========================================
# Tab列表头部 (现代化设计)
# ========================================
header:
  enabled: true
  refresh-interval: 2000
  lines:
    - "&8&m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    - ""
    - "  &6&l✦ &e&l光 点 RPG &6&l✦"
    - "  &7&o探索冒险的世界"
    - ""
    - "  &f� &7服务器: &a%server_online%&7/&a%server_max_players% &7人在线"
    - "  &f⚡ &7状态: &a正常"

footer:
  enabled: true
  refresh-interval: 2000
  lines:
    - ""
    - "  &f❤ &7TPS: &a%server_tps% &8| &7延迟: &a%player_ping%ms"
    - ""
    - "  &6&l➤ &e官网: &bwww.guangdianrpg.com"
    - "  &6&l➤ &e群聊: &a2271257344"
    - ""
    - "&8&m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

# ========================================
# Tab列表格式 (现代化RPG风格)
# ========================================
# 支持的占位符:
# PlaceholderAPI: %xxx%
# LuckPerms: %luckperms_prefix%, %luckperms_suffix%, %luckperms_primary_group_name%
# GuangDianGuild: %gdguild_in_guild%, %gdguild_name%
# GuangDianMarriage: %gdmarriage_partner%
# GuangDianCombat: %gdcombat_in_combat%

# 默认格式 (无权限组的玩家)
default-format:
  prefix: "&7◆ &f"
  name: "&7%player_name%"
  suffix: " &8[&7Lv.%player_level%&8]"
  ping:
    low: "&a"
    medium: "&e"
    high: "&c"
  condition: ""

# ========================================
# 权限组格式 (带图标和颜色)
# ========================================
group-formats:
  owner:
    prefix: "&6&l⚜ &e&l服主 &6&l⚜ &f"
    name: "&e%player_name%"
    suffix: " &8[&6Lv.%player_level%&8]"
    weight: 1000
    condition: "group:owner"

  admin:
    prefix: "&c&l⚡ &f"
    name: "&c%player_name%"
    suffix: " &8[&cAdmin&8]"
    weight: 900
    condition: "group:admin"

  admin2:
    prefix: "&c&l⚡ &f"
    name: "&c%player_name%"
    suffix: " &8[&c管理&8]"
    weight: 850
    condition: "permission:guangdian.admin"

  gm:
    prefix: "&b&l☆ &f"
    name: "&b%player_name%"
    suffix: " &8[&bGM&8]"
    weight: 800
    condition: "group:gm"

  svip:
    prefix: "&d&l♦ &5&lSVIP &d&l♦ &f"
    name: "&d%player_name%"
    suffix: " &8[&dSVIP&8]"
    weight: 700
    condition: "permission:guangdian.svip"

  vip:
    prefix: "&6&l★ &e&lVIP &6&l★ &f"
    name: "&e%player_name%"
    suffix: " &8[&6VIP&8]"
    weight: 600
    condition: "permission:guangdian.vip"

  mvp:
    prefix: "&e&l♦ &f"
    name: "&e%player_name%"
    suffix: " &8[&eMVP&8]"
    weight: 500
    condition: "group:mvp"

  member:
    prefix: "&a&l● &f"
    name: "&a%player_name%"
    suffix: " &8[&a冒险者&8]"
    weight: 100
    condition: ""

# ========================================
# Tab列表排序
# ========================================
sort-by-weight: true

# ========================================
# 头顶名称标签 (由GuangDianName处理)
# ========================================
nametag:
  enabled: false

# ========================================
# 消息设置 (现代化风格)
# ========================================
messages:
  no-permission: "&c✗ &f您没有权限执行此操作!"
  config-reloaded: "&a✓ &fTab列表配置已重新加载!"
  info-header: "&6&l━━━ 光点Tab列表 ━━━"
  info-version: "&e版本: &f"
  info-author: "&e作者: &fGumin"
  info-qq: "&eQQ: &f2271257344"
  info-status: "&e状态: &a已启用"
  info-refresh: "&e刷新间隔: &f"

# ========================================
# 高级设置
# ========================================
advanced:
  debug: false
  disabled-worlds: []
  hide-spectators: false

  # AFK玩家标记
  afk:
    enabled: true
    format: "&7[AFK] &f"

  # 玩家加入/退出提示
  join-quit:
    enabled: true
    join: "&a➤ &e%player_name% &7加入了游戏"
    quit: "&c➤ &e%player_name% &7离开了游戏"

# ========================================
# 特殊显示标签
# ========================================
# 用于在Tab中显示特殊状态
special-tags:
  # 战斗状态
  combat:
    enabled: true
    in-combat: "&c&l⚔ 战斗 &r"
    out-combat: ""

  # 工会状态
  guild:
    enabled: true
    has-guild: "&b&l⚔ %gdguild_name%"
    no-guild: ""

  # 婚姻状态
  marriage:
    enabled: true
    married: "&d&l❤ %gdmarriage_partner%"
    single: ""
