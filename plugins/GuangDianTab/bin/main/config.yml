# ========================================
# 光点Tab列表插件配置文件
# GuangDianTab Configuration
# ========================================
# 作者: Gumin
# QQ: 2271257344
# 版本: 1.0.0
# ========================================

# ========================================
# 基础设置
# ========================================
enabled: true

# 刷新间隔 (毫秒)
# 推荐值: 1000-5000 (1-5秒)
refresh-interval: 1000

# ========================================
# Tab列表头部和尾部
# ========================================
# 显示在Tab列表的顶部和底部
# 支持多行，使用 \n 换行
# 支持所有占位符
header:
  enabled: true
  refresh-interval: 1000
  lines:
    - "&6&l━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    - ""
    - "&6&l★ &e&l光点RPG &6&l★"
    - "&7一个充满冒险的世界"
    - ""
    - "&e&l服务器信息: &a%server_online%&7/&a%server_max_players% &e在线"

footer:
  enabled: true
  refresh-interval: 1000
  lines:
    - ""
    - "&e&l服务器TPS: &a%server_tps_1%"
    - "&e&l你的延迟: &a%player_ping%ms"
    - ""
    - "&7官网: &bwww.guangdianrpg.com"
    - "&7QQ群: &a123456789"
    - ""
    - "&6&l━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

# ========================================
# Tab列表格式
# ========================================
# 支持的占位符:
# PlaceholderAPI: %xxx%
# 内置: %player%, %player_name%, %player_level%, %player_ping%
# LuckPerms: %luckperms_prefix%, %luckperms_suffix%, %luckperms_primary_group_name%
# Vault: %vault_eco_balance%, %vault_eco_balance_fixed%
#
# 格式说明:
# - prefix: 玩家名前显示的内容 (称号、等级等)
# - name: 玩家名格式
# - suffix: 玩家名后显示的内容
# ========================================

# 默认格式 (无权限组的玩家)
default-format:
  prefix: "&7[玩家] "
  name: "&f%player_name%"
  suffix: ""
  ping:
    low: "&a"      # ping < 50
    medium: "&e"   # 50 <= ping < 150
    high: "&c"     # ping >= 150

# ========================================
# 权限组格式
# ========================================
# 不同权限组的玩家显示不同的格式
# 格式: 权限组名 -> 显示格式
# ========================================
group-formats:
  admin:
    prefix: "&c[管理员] "
    name: "&c%player_name%"
    suffix: " &7[&c%player_ping%ms&7]"
    weight: 100
    
  owner:
    prefix: "&6[服主] "
    name: "&6%player_name%"
    suffix: " &7[&6%player_ping%ms&7]"
    weight: 200
    
  vip:
    prefix: "&b[VIP] "
    name: "&b%player_name%"
    suffix: " &7[&b%player_ping%ms&7]"
    weight: 50
    
  svip:
    prefix: "&d[SVIP] "
    name: "&d%player_name%"
    suffix: " &7[&d%player_ping%ms&7]"
    weight: 60
    
  mvp:
    prefix: "&e[MVP] "
    name: "&e%player_name%"
    suffix: " &7[&e%player_ping%ms&7]"
    weight: 70

# ========================================
# Tab列表排序
# ========================================
# 按权限组权重排序 (权重越大越靠前)
sort-by-weight: true

# 或者按玩家名排序
# sort-by-name: false

# ========================================
# 头顶名称标签
# ========================================
# 同时修改玩家头顶显示的名称
nametag:
  enabled: true
  # 显示格式: prefix + name + suffix
  # 设置为空则使用Tab列表格式
  
# ========================================
# 消息设置
# ========================================
messages:
  no-permission: "&c您没有权限执行此操作!"
  config-reloaded: "&aTab列表配置已重新加载!"
  info-header: "&6===== 光点Tab列表插件信息 ====="
  info-version: "&e版本: &f"
  info-author: "&e作者: &fGumin"
  info-qq: "&eQQ: &f2271257344"
  info-status: "&e状态: &a已启用"
  info-refresh: "&e刷新间隔: &f"

# ========================================
# 高级设置
# ========================================
advanced:
  debug: false
  
  # 自动隐藏世界 (在这些世界不修改Tab)
  disabled-worlds: []
  
  # 观察者模式隐藏
  hide-spectators: false
  
  # AFK玩家标记
  afk:
    enabled: true
    format: "&7[AFK] "
    
  # 玩家加入/退出提示
  join-quit:
    enabled: true
    join: "&a+ &e%player_name% &7加入了游戏"
    quit: "&c- &e%player_name% &7离开了游戏"
