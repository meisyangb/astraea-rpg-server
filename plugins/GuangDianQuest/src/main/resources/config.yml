# ========================================
# GuangDianQuest 配置文件
# ========================================

# 最大同时进行任务数
max-active-quests: 10

# 每日任务上限
daily-quest-limit: 5

# 任务完成公告
quest-complete-broadcast:
  main: true
  daily: false
  achievement: true

# 自动保存间隔（秒）
auto-save-interval: 300

# 消息配置
messages:
  quest-accepted: "&a成功接取任务: &e{quest}"
  quest-completed: "&a任务完成: &e{quest}"
  quest-abandoned: "&c已放弃任务: &e{quest}"
  quest-not-found: "&c任务不存在！"
  quest-already-active: "&c你已经接取了这个任务！"
  quest-already-completed: "&c你已经完成了这个任务！"
  quest-prerequisites-not-met: "&c前置任务未完成！"
  quest-limit-reached: "&c任务数量已达上限！"
  daily-limit-reached: "&c今日任务数量已达上限！"
  quest-level-not-met: "&c等级不足！需要等级: {level}"
