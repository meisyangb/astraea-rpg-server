# ========================================
# GuangDianDropControl Configuration
# ========================================
# Author: Gumin
# QQ: 2271257344
# Version: 1.0.0
# ========================================
# 控制玩家是否可以丢弃物品
# ========================================

# ========================================
# 基础设置
# ========================================
settings:
  # 全局丢弃开关
  # false = 禁止丢弃 (默认)
  # true = 允许丢弃
  enabled: false

# ========================================
# 消息设置
# ========================================
messages:
  no-permission: "&c你没有权限执行此操作!"
  drop-disabled: "&c物品丢弃已禁用!"
  drop-enabled: "&a物品丢弃已启用!"
  player-enabled: "&a已允许 %player% 丢弃物品"
  player-disabled: "&c已禁止 %player% 丢弃物品"
  reload: "&a配置已重新加载!"
  usage: "&e用法: /gddrop <enable|disable|player|reload|status> [玩家]"
  status: "&e当前全局丢弃状态: %status%"

# ========================================
# 权限说明
# ========================================
# gddrop.admin - 管理命令权限
# gddrop.bypass - 绕过丢弃限制
