# ─── 装备分解系统配置 ───

# 调试模式
debug: false

# 分解界面标题
gui-title: "&8装备分解"

# 分解音效
sounds:
  success: "BLOCK_ANVIL_USE"
  fail: "ENTITY_ITEM_BREAK"

# 分解消息
messages:
  success: "&a分解成功！获得材料: &f{materials}"
  no-permission: "&c你没有权限使用分解功能！"
  not-mythic-item: "&c此物品无法分解！"
  no-decompose-rule: "&c该装备没有配置分解规则！"
  inventory-full: "&c背包已满，无法获得分解材料！"

# 分解规则配置文件
rules-file: "rules.yml"
