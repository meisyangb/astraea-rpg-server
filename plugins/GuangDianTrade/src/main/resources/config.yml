# ========================================
# 基础设置
# ========================================
settings:
  # 交易请求超时时间(秒)
  request-timeout: 30
  
  # 交易请求冷却时间(秒)
  request-cooldown: 5
  
  # 消息前缀
  prefix: "&6[&e交易&6] "

# ========================================
# 消息设置
# ========================================
messages:
  no-permission: "&c你没有权限使用交易功能!"
  request-sent: "&a已向 &e%player% &a发送交易请求!"
  request-received: "&e%player% &a想与你交易!"
  request-timeout: "&c交易请求已超时!"
  request-denied: "&c已拒绝交易请求!"
  trade-started: "&a交易已开始!"
  trade-completed: "&a交易完成!"
  trade-cancelled: "&c交易已取消!"
  already-trading: "&c你正在交易中!"
  target-trading: "&c该玩家正在交易中!"
  player-offline: "&c玩家不在线!"
  no-pending-request: "&c没有待处理的交易请求!"

# ========================================
# 高级设置
# ========================================
advanced:
  debug: false
