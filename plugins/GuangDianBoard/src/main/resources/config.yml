# GuangDianBoard 配置文件

# 刷新间隔 (毫秒) - 改为保底刷新间隔
refresh-interval: 5000
title-refresh-interval: 1500

# 智能刷新设置
smart-refresh:
  enabled: true
  event-cooldown: 1000
  detect-equipment-change: true
  detect-attribute-change: true

title: '&fLv.&e%player_level% &a%player_name%'

title-animation:
  enabled: false
  frames: []

# ========================================
# 世界别名设置 (世界中文名)
# ========================================
world-aliases:
  world: "生存世界"
  world_nether: "下界"
  world_the_end: "末地"
  spawn: "出生点大厅"
  rpg: "RPG世界"
  CaveFuWorld: "洞府世界"
  gsslc: "古神试炼场"

# 高级设置
advanced:
  debug: false
  max-lines: 15
  remember-toggle-state: true
  show-by-default: true
  hidden-worlds: []
  hide-when-sneaking: false
  hide-in-combat: false

# 消息设置
messages:
  no-permission: "&c您没有权限执行此操作!"
  board-enabled: "&a侧边栏已启用!"
  board-disabled: "&c侧边栏已关闭!"
  config-reloaded: "&a侧边栏配置已重新加载!"

# ========================================
# 侧边栏显示内容
# ========================================
lines:
  - '&a&n﹏﹏﹏﹏﹏﹏﹏﹏﹏﹏'
  - ''
  - '&6✔ &b金币&f: &e%vault_eco_balance_formatted%'
  - '&3✔ &b点券&f: &e%gdpoints_balance_formatted%'
  - '&c✚ &b生命&f: &c%gdrpg_health%'
  - '&c々 &b工会&f: &b%gdguild_name%'
  - '&d✟ &b称号&f: %luckperms_prefix%&f'
  - '&5✿ &b伴侣&f: &d%gdmarriage_partner%'
  - '&e⚔ &b锻造等级&f: &e%forge_level%'
  - '&e✦ &b锻造经验&f: &e%forge_exp%'
  - '&b当前世界&f: &e%player_world%'
  - '&b全服人数&f: &e&l%server_online%'
  - '&b官方①群&f: &d2271257344'
  - ''
  - '&a&n﹏﹏﹏﹏﹏﹏﹏﹏﹏﹏'