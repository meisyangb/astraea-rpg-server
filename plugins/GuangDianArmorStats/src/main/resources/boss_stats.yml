# ========================================
# BOSS属性配置文件 (工业级重构)
# ========================================
# 为MythicMobs怪物定义自定义属性
# 
# 【重要说明】
# 1. BOSS血量完全由 MythicMobs 自己管理，本插件不修改
# 2. 本配置只为BOSS附加以下属性，用于伤害计算：
#    - 攻击力范围 (attack.min/max)
#    - 防御属性 (defense.base/armor_percent/damage_reduction)
#    - 暴击/闪避/招架 (crit/dodge/parry)
#    - 穿透属性 (penetration)
#    - 元素伤害/抗性 (elemental)
# 3. 公告功能请在 MythicMobs 怪物配置中使用 Skills 实现：
#    - 出生公告: ~onSpawn 触发 message/sendtitle
#    - 死亡公告: ~onDeath 触发 message/sendtitle
#    - 血量阶段: ~onDamaged <30% 触发技能
# ========================================

