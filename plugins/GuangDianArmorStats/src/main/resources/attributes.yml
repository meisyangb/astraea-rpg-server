# ========================================
# 属性解析配置
# ========================================
# 定义如何从物品描述(Lore)中解析属性值
# 
# 格式: 属性名称: '正则表达式'
# - 支持单值(如: 100)和范围值(如: 100-200)
# - 注意: 正则匹配的是去除颜色代码后的纯文本
# - 解析器会先去除颜色代码(&[0-9a-fk-or])后再匹配
#
# Lore示例 (物品显示的颜色不受影响):
#   &8攻击力: &c100-200    -> 解析为 "攻击力: 100-200"
#   &8暴击几率: &a25.5%    -> 解析为 "暴击几率: 25.5%"
# ========================================

# 数值型属性 (整数)
attributes:
  每秒回血: '每秒回血[:\s]*\+?([\d]+)'
  生命上限: '生命上限[:\s]*\+?([\d]+)'
  
  # 范围型属性 (最小值-最大值)
  攻击力: '攻击力[:\s]*\+?([\d]+)-([\d]+)'
  防御力: '防御力[:\s]*\+?([\d]+)-([\d]+)'
  
  # 百分比属性 (小数+百分号)
  暴击抵抗: '暴击抵抗[:\s]*\+?([\d.]+)%'
  闪避: '闪避[:\s]*\+?([\d.]+)%'
  暴伤抵抗: '暴伤抵抗[:\s]*\+?([\d.]+)%'
  暴击几率: '暴击几率[:\s]*\+?([\d.]+)%'
  暴击伤害: '暴击伤害[:\s]*\+?([\d.]+)%'
  招架: '招架[:\s]*\+?([\d.]+)%'
  吸血抵抗: '吸血抵抗[:\s]*\+?([\d.]+)%'
  伤害反弹: '伤害反弹[:\s]*\+?([\d.]+)%'
  反伤比例: '反伤比例[:\s]*\+?([\d.]+)%'
  中毒: '中毒[:\s]*\+?([\d.]+)%'
  移动速度: '移动速度[:\s]*\+?([\d.]+)%'
  吸血几率: '吸血几率[:\s]*\+?([\d.]+)%'
  吸血倍率: '吸血倍率[:\s]*\+?([\d.]+)%'
  冰冻: '冰冻[:\s]*\+?([\d.]+)%'
  致盲: '致盲[:\s]*\+?([\d.]+)%'
  经验加成: '经验加成[:\s]*\+?([\d.]+)%'
  
  # PVP专用属性
  PVP攻击力: '【PVP】攻击力[:\s]*\+?([\d]+)-([\d]+)'
  PVP防御力: '【PVP】防御力[:\s]*\+?([\d]+)-([\d]+)'