# ========================================
# 宝石系统配置
# ========================================

# 宝石属性解析规则
# 定义每种宝石提供的属性
gems:
  红宝石: '&8攻击力:\s*(?:&[0-9a-fk-or])*([\d]+)-([\d]+)'
  绿宝石: '&8生命上限:\s*(?:&[0-9a-fk-or])*([\d]+)'
  黄宝石: '&8防御力:\s*(?:&[0-9a-fk-or])*([\d]+)-([\d]+)'
  紫宝石: '&8闪避:\s*(?:&[0-9a-fk-or])*([\d.]+%)'

# 宝石插槽识别
# Lore示例: &8可镶嵌<红宝石>
gem_socket: '&8可镶嵌<([^>]+)>'

# 宝石重铸配置
# 玩家可以重新随机宝石属性的属性值
gem_rework:
  enabled: true
  cost_item: AMETHYST_SHARD
  cost_amount: 1
  exp_levels: 0
  success_chance: 0.85
  fail_mode: destroy_one
  insurance:
    enabled: true
    item: TOTEM_OF_UNDYING
    amount: 1
    consume_on_use: true