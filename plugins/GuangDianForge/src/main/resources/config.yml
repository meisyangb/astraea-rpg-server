# ─── 锻造系统全局配置 ───

# 调试模式（开启后会在控制台输出详细的匹配日志）
debug: false

# 每次锻造消耗的经验等级
forge-exp-cost: 3

# 锻造等级每级提供的成功率加成
success-rate-per-forge-level: 0.02

# 锻造成功获得的经验
exp-on-success: 100

# 锻造失败获得的经验（安慰奖）
exp-on-failure: 20

# 锻造等级经验需求表（等级 -> 需要的累计经验）
level-thresholds:
  1: 0
  2: 200
  3: 500
  4: 1000
  5: 2000
  6: 3500
  7: 5500
  8: 8000
  9: 11000
  10: 15000