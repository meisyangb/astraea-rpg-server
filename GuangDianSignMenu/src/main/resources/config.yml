# GuangDianSignMenu 配置文件
# 右键告示牌执行命令

# 消息前缀
prefix: "&8[&6告示牌&8] "

# 告示牌触发规则
# 格式: 告示牌文本 -> 命令列表
# 匹配时忽略大小写和首尾空格
# 注意: 只有拥有 signmenu.admin 权限的玩家创建的告示牌才能触发命令

sign-commands:
  # 示例：右键显示[商店]的告示牌执行命令
  "[商店]":
    - "spawn"
    - "menu:shop"
  
  # 示例：右键显示[传送]的告示牌
  "[传送]":
    - "tpa"
    - "warp main"
  
  # 示例：右键显示[签到]的告示牌
  "[签到]":
    - "signin"
