name: GuangDianBoard
version: 1.0.0
main: cn.guangdian.board.GuangDianBoard
api-version: '1.21'
author: Gumin
description: 光点RPG侧边栏计分板插件 - 支持PlaceholderAPI和LuckPerms
website: www.guangdianrpg.com

depend:
  - PlaceholderAPI

softdepend:
  - LuckPerms
  - Vault

commands:
  gdboard:
    description: 侧边栏插件管理命令
    usage: /gdboard <reload|toggle|info|help>
    aliases: [gdb, board, sidebar]
  toggleboard:
    description: 切换侧边栏显示
    usage: /toggleboard
    aliases: [tb, scoreboard]

permissions:
  guangdian.board.use:
    description: 使用侧边栏权限
    default: true
  guangdian.board.toggle:
    description: 切换侧边栏显示权限
    default: true
  guangdian.board.admin:
    description: 管理员权限
    default: op
  guangdian.board.reload:
    description: 重载配置权限
    default: op
