enabled: true

default-menu: "main"

right-click:
  enabled: true
  lore-trigger: "<yellow>右键打开主菜单"

menu-item:
  enabled: true
  menu: "main"
  material: CLOCK
  name: "<gold><bold>主菜单"
  lore:
    - "<yellow>右键打开主菜单"
    - "<gray>打开服务器功能导航"
    - "<dark_gray>光点传奇专属物品"
  unbreakable: true
  glowing: true
  auto-give-on-join: true
  only-if-missing: true
  inventory-slot: 4

menus:
  main:
    title: "<gold><bold>光点传奇 <dark_gray>┃ <yellow>功能菜单"
    size: 54
    items:
      server-info:
        slot: 4
        material: NETHER_STAR
        name: "<gold><bold>服务器信息"
        lore:
          - "<dark_gray><strikethrough>--------------------"
          - "<gray>服务器: <gold>光点传奇"
          - "<gray>当前世界: <yellow>%player_world%"
          - "<gray>在线人数: <green>%server_online%<gray>/<green>%server_max_players%"
          - "<gray>当前延迟: <aqua>%player_ping%ms"
          - "<dark_gray><strikethrough>--------------------"
          - "<yellow>点击查看在线提示"
        action: "message:<gold>服务器在线人数: <yellow>%server_online%<gray>/<yellow>%server_max_players%"

      player-info:
        slot: 13
        material: PLAYER_HEAD
        skull: "%player_name%"
        name: "<yellow><bold>角色信息"
        lore:
          - "<dark_gray><strikethrough>--------------------"
          - "<gray>昵称: <white>%player_name%"
          - "<gray>称号: %luckperms_prefix%"
          - "<gray>等级: <aqua>Lv.%player_level%"
          - "<gray>血量: <red>%player_health%<gray>/<red>%player_max_health%"
          - "<gray>金币: <gold>%vault_eco_balance_formatted%"
          - "<gray>点券: <yellow>%gdpoints_points%"
          - "<gray>工会: <dark_aqua>%gdguild_name%"
          - "<gray>婚姻: <light_purple>%gdmarriage_partner%"
          - "<dark_gray><strikethrough>--------------------"

      market:
        slot: 20
        material: EMERALD
        name: "<green><bold>全球市场"
        lore:
          - "<gray>浏览玩家寄售与交易"
          - "<yellow>点击打开市场"
        action: "command:market"

      guild:
