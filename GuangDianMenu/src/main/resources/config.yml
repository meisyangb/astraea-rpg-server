# ========================================
# 消息设置 - MiniMessage 格式
# ========================================
messages:
  no-permission: "<red>你没有权限执行此操作!"
  config-reloaded: "<green>菜单配置已重载!"
  menu-not-found: "<red>菜单不存在!"
  unknown-action: "<red>未知的菜单动作类型!"
  # 点击音效 - Paper 1.21+ 格式
  click-sound: "minecraft:block.note_block.pling"
  click-volume: 1.0
  click-pitch: 1.0
  # 失败音效
  fail-sound: "minecraft:block.note_block.bass"
  fail-volume: 1.0
  fail-pitch: 0.5

advanced:
  debug: false
  update-check: true

# ========================================
# 菜单项条件配置说明
# ========================================
# 每个菜单项可以配置 conditions 来限制使用条件
# 条件不满足时会显示提示消息，不会执行动作
#
# 示例:
# items:
#   shop_item:
#     material: DIAMOND
#     slot: 0
#     name: "<gold>购买钻石剑"
#     lore:
#       - "<gray>价格: <yellow>1000 点券"
#     action: "command:rpgitem 钻石剑 give {player} 1"
#     keep-open: true  # 执行后保持菜单打开
#     conditions:
#       points: 1000           # 需要点券
#       money: 500.0           # 需要金币
#       level: 10              # 需要等级
#       permission: "vip.buy"  # 需要权限
#       items:                 # 需要物品
#         item1:
#           material: "GOLD_INGOT"
#           amount: 5
#           name: "<gold>金锭"  # 可选，物品名称匹配
#       fail-message: "<red>你的点券不足!"  # 自定义失败消息
#
# 支持的 action 类型:
# - menu:菜单名          - 打开指定菜单
# - command:命令         - 玩家执行命令 (自动添加 /)
# - console:命令         - 控制台执行命令
# - message:消息         - 发送消息给玩家
# - close                - 关闭菜单
# - 直接写命令            - 默认作为控制台命令执行
#
# 占位符:
# - %player%             - 玩家名
# - %player_name%        - 玩家名
# - %player_level%       - 玩家等级
# - %player_health%      - 玩家血量
# - %vault_eco_balance%  - 金币余额
# - %gdpoints_points%    - 点券余额
# - {player}             - 玩家名 (在命令中)
