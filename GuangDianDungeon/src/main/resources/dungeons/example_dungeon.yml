# ========================================
# 示例副本配置 - 试炼之地
# 使用 MythicMobs 怪物，支持 stages/waves 波次系统
# ========================================

id: "example_dungeon"
name: "试炼之地"
description: "击败试炼守卫和试炼BOSS，证明你的实力！"
version: "1.0.0"
author: "Astraea"

# 地图名称 (对应 map/ 文件夹下的子目录，包含 level.dat 文件)
map: "example_dungeon"

icon:
  material: "DIAMOND_SWORD"
  custom-model-data: 0

settings:
  max-players: 5
  min-players: 1
  time-limit: 1800
  cooldown: 3600
  max-deaths: 10
  revive-cooldown: 30
  requirements:
    min-level: 0
    max-level: 0
    permission: null

difficulties:
  - id: "normal"
    name: "普通"
    health-multiplier: 1.0
    damage-multiplier: 1.0
    mob-count-multiplier: 1.0
    reward-multiplier: 1.0
    exp-multiplier: 1.0
    time-limit-modifier: 0
    max-deaths-modifier: 0
    
  - id: "hard"
    name: "困难"
    health-multiplier: 1.5
    damage-multiplier: 1.3
    mob-count-multiplier: 1.2
    reward-multiplier: 1.5
    exp-multiplier: 1.5
    time-limit-modifier: -300
    max-deaths-modifier: -3

# ========================================
# 生成点
# ========================================
spawn-points:
  center:
    location:
      x: 0
      y: 64
      z: 0
    radius: 5
  left:
    location:
      x: -10
      y: 64
      z: 0
    radius: 3
  right:
    location:
      x: 10
      y: 64
      z: 0
    radius: 3
  boss_spawn:
    location:
      x: 0
      y: 64
      z: 10
    radius: 3

# ========================================
# 阶段/波次系统 (使用 MythicMobs 怪物名称)
# ========================================
stages:
  - id: "stage_1"
    name: "第一波 - 试炼守卫"
    type: COMBAT
    waves:
      - id: "wave_1"
        start-message: "<yellow>试炼守卫出现了！击败它们！"
        completion-message: "<green>试炼守卫已被清除！"
        time-limit: 300
        exp-reward: 500
        spawns:
          - mob: "TrialGuard"
            spawn-point: "center"
            amount: 5
            radius: 5
            delay: 0
        completion:
          type: KILL_ALL
        next-wave-trigger:
          type: ON_KILL_COMPLETE

  - id: "stage_2"
    name: "第二波 - 死灵士兵"
    type: COMBAT
    waves:
      - id: "wave_2"
        start-message: "<yellow>死灵士兵从阴影中涌出！"
        completion-message: "<green>死灵士兵全军覆没！"
        time-limit: 300
        exp-reward: 800
        spawns:
          - mob: "死灵士兵"
            spawn-point: "left"
            amount: 5
            radius: 3
            delay: 0
          - mob: "死灵弓箭手"
            spawn-point: "right"
            amount: 3
            radius: 3
            delay: 10
        completion:
          type: KILL_ALL
        next-wave-trigger:
          type: ON_KILL_COMPLETE

  - id: "stage_3"
    name: "BOSS战 - 死灵领主"
    type: BOSS
    on-complete:
      - type: MESSAGE
        content: "<green><bold>恭喜通关试炼之地！"
      - type: TITLE
        content: "<green><bold>副本通关！"
        subtitle: "<yellow>试炼之地已被征服"
      - type: SOUND
        sound: "ui.toast.challenge_complete"
        volume: 1.0
    waves:
      - id: "boss_wave"
        start-message: "<red><bold>死灵领主降临！准备迎战！"
        completion-message: "<green>死灵领主已被击败！"
        time-limit: 600
        exp-reward: 2000
        spawns:
          - mob: "死灵领主"
            spawn-point: "boss_spawn"
            amount: 1
            radius: 0
            is-boss: true
            health-bar: true
            announce-skills: true
            boss-hp-triggers:
              - hp-percent: 50.0
                message: "死灵领主发怒了！召唤更多士兵！"
                spawns:
                  - mob: "死灵士兵"
                    spawn-point: "left"
                    amount: 3
                    radius: 3
              - hp-percent: 25.0
                message: "死灵领主进入狂暴状态！"
                spawns:
                  - mob: "死灵战士"
                    spawn-point: "right"
                    amount: 3
                    radius: 3
        completion:
          type: KILL_ALL
        next-wave-trigger:
          type: ON_KILL_COMPLETE

# ========================================
# 奖励池
# ========================================
reward-pools:
  basic:
    - item: "diamond@5"
      weight: 50
      chance: 1.0
    - item: "gold_ingot@32"
      weight: 30
      chance: 1.0
      
  rare:
    - item: "enchanted_book@1"
      weight: 40
      chance: 0.5

first-clear-rewards:
  exp: 5000
  items: []

score-rewards:
  - min-score: 800
    items: []
  - min-score: 1000
    items: []

# ========================================
# 传送点
# ========================================
teleports:
  entrance:
    x: 0
    y: 64
    z: 0
  lobby:
    x: 5
    y: 64
    z: 5
  exit:
    x: 0
    y: 64
    z: 0