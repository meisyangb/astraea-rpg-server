# 默认配置：按怪物等级计算修为 (如果怪物不在上面列表中)
default_cultivation:
  enabled: true
  # 公式: 基础值 * 等级^系数
  base: 1
  exponent: 1.5
  # 最大修为奖励
  max_cultivation: 100000

# 设置
settings:
  # 是否需要突破才能晋升
  require_breakthrough: true
  # 突破成功率基础值
  base_breakthrough_chance: 80
  # 每低一境界增加的成功率
  lower_realm_bonus: 5
  # 突破失败损失修为比例
  fail_loss_percent: 10
  # 修为通知间隔
  cultivation_notify_interval: 100

# 消息配置
messages:
  prefix: "<gold>[境界] <white>"
  cultivation_gain: "<yellow>获得 {amount} 点修为! (累计: {total})"
  breakthrough_success: "<green>突破成功! 你已晋升为 {realm}!"
  breakthrough_fail: "<red>突破失败! 损失了 {loss} 点修为..."
  realm_info: "<yellow>当前境界: <white>{realm}"
  cultivation_info: "<yellow>当前修为: <white>{cultivation} / {required}"
  next_realm: "<yellow>下一境界: <white>{next_realm} (需要 {required} 修为)"
  realm_max: "<gold>你已达到最高境界!"
  not_ready: "<red>修为不足，无法突破!"
  no_realm: "<red>你还没有境界!"