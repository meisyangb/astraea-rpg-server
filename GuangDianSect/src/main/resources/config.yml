# =====================================================
# GuangDianSect 修仙门派系统配置文件
# =====================================================

# 门派配置
sects:
  # 青云宗 - 剑修，强化武器变强
  qingyun:
    name: "青云宗"
    type: "正道"
    element: "剑"
    description: "青云直上九万里，剑气纵横天地间。青云宗以剑道著称，弟子通过强化武器获得力量。"
    color: "<#55FFFF>"
    icon: DIAMOND_SWORD
    # 变强模式配置
    power_mode:
      type: "enhance_weapon"  # 强化武器变强
      contribution_per_enhance: 10  # 每次强化获得贡献值
      bonus_per_level: 5  # 每级强化额外奖励
      
  # 合欢宗 - 魔道媚术，结婚次数越多越强
  hehuan:
    name: "合欢宗"
    type: "魔道"
    element: "魅"
    description: "合欢一曲断人肠，红颜薄命亦如霜。合欢宗弟子通过婚姻羁绊获得力量，结缘越多越强。"
    color: "<#FF55FF>"
    icon: NETHER_STAR
    power_mode:
      type: "marriage"  # 结婚变强
      contribution_per_marriage: 100  # 每次结婚获得贡献值
      bonus_per_spouse_level: 20  # 配偶等级加成
      
  # 天音寺 - 佛门正道，治疗救人变强
  tianyin:
    name: "天音寺"
    type: "佛门"
    element: "佛"
    description: "天音梵唱度众生，慈悲为怀济世人。天音寺弟子通过治疗他人积累功德获得力量。"
    color: "<#FFFF55>"
    icon: GOLDEN_APPLE
    power_mode:
      type: "heal"  # 治疗变强
      contribution_per_heal: 1  # 每恢复1点生命获得贡献值
      min_heal_amount: 10  # 最小治疗量才计算
      contribution_cap_per_action: 50  # 每次治疗最大贡献值
      
  # 焚香谷 - 火系正道，造成伤害变强
  fenxiang:
    name: "焚香谷"
    type: "正道"
    element: "火"
    description: "焚香谷中火云涌，烈焰焚天震九州。焚香谷弟子通过战斗积累经验，越战越强。"
    color: "<#FF5555>"
    icon: BLAZE_POWDER
    power_mode:
      type: "damage"  # 伤害变强
      contribution_per_damage: 1  # 每10点伤害获得1贡献值
      damage_divisor: 10  # 伤害除数
      mob_bonus: 1  # 怪物伤害额外倍率
      boss_bonus: 5  # BOSS伤害额外倍率
      
  # 鬼王宗 - 鬼道魔门，杀人变强
  guiwang:
    name: "鬼王宗"
    type: "魔道"
    element: "鬼"
    description: "鬼王宗内鬼气森，亡魂渡引祸众生。鬼王宗弟子通过收割灵魂获得力量，杀敌越多越强。"
    color: "<#555555>"
    icon: SOUL_SAND
    power_mode:
      type: "kill"  # 杀人变强
      contribution_per_player_kill: 50  # 击杀玩家获得贡献值
      contribution_per_mob_kill: 5  # 击杀怪物获得贡献值
      contribution_per_boss_kill: 100  # 击杀BOSS获得贡献值
      pvp_bonus: 2  # PVP击杀额外倍率
      
  # 长生堂 - 炼丹世家，炼丹变强
  changsheng:
    name: "长生堂"
    type: "世家"
    element: "丹"
    description: "长生堂中炼灵丹，起死回生亦不难。长生堂弟子通过炼制丹药积累医术，丹成则力增。"
    color: "<#55FF55>"
    icon: BREWING_STAND
    power_mode:
      type: "alchemy"  # 炼丹变强
      contribution_per_potion_brew: 10  # 酿造药水获得贡献值
      contribution_per_custom_item: 30  # 炼制自定义丹药获得贡献值
      tier_bonus_multiplier: 2  # 高级丹药倍率

