# 设置
settings:
  # 是否允许玩家退出门派
  allow_leave: true
  # 退出门派冷却时间(秒)
  leave_cooldown: 86400
  # 门派聊天前缀
  chat_prefix: "<gray>[<gold>宗门<gray>] "
  # GUI标题
  gui_title: "选择你的门派"
  # 最大贡献值存储
  max_contribution: 100000
  # 新玩家自动触发门派选择GUI (已禁用，玩家需要手动使用 /sect gui)
  auto_open_gui_for_new_player: false
  # 贡献值提示频率 (每获得多少贡献提示一次)
  contribution_notify_interval: 50

# 消息配置
messages:
  prefix: "<gold>[宗门] <white>"
  player-only: "<red>该命令只能由玩家执行!"
  no-permission: "<red>你没有权限执行此操作!"
  already-in-sect: "<red>你已经加入了门派!"
  not-in-sect: "<red>你还没有加入门派!"
  sect-not-found: "<red>门派不存在!"
  join-success: "<green>你成功加入了 {sect}!"
  leave-success: "<yellow>你已退出了 {sect} 门派!"
  leave-cooldown: "<red>你需要等待 {time} 秒才能再次退出门派!"
  sect-info-title: "<gold>========== {sect} 信息 =========="
  sect-info-type: "<yellow>门派类型: <white>{type}"
  sect-info-power: "<yellow>变强方式: <white>{power}"
  sect-info-desc: "<yellow>门派简介: <white>{description}"
  sect-info-members: "<yellow>门派人数: <white>{count}"
  sect-info-contribution: "<yellow>你的贡献: <white>{contribution}"
  rank-up: "<green>恭喜! 你的门派职位晋升为 {rank}!"
  rank-set: "<green>已将 {player} 的职位设置为 {rank}!"
  contribution-add: "<green>你获得了 {amount} 点门派贡献!"
  contribution-notify: "<yellow>[{sect}] 贡献值 +{amount} (累计: {total})"
  power-tip-qingyun: "<aqua>强化武器可获得门派贡献!"
  power-tip-hehuan: "<light_purple>结婚可获得门派贡献!"
  power-tip-tianyin: "<yellow>治疗他人可获得门派贡献!"
  power-tip-fenxiang: "<red>战斗伤害可获得门派贡献!"
  power-tip-guiwang: "<dark_gray>击杀敌人可获得门派贡献!"
  power-tip-changsheng: "<green>炼制丹药可获得门派贡献!"