# ========================================
# 生命恢复配置
# ========================================
# 控制"每秒回血"属性的生效方式
# ========================================

# 回血间隔 (tick, 20tick=1秒)
interval: 20

# 战斗中是否允许回血
combat_regen: true

# 战斗中回血倍率
# 0.2 = 战斗中回血效果只剩20%
combat_multiplier: 0.2

# 战斗状态超时 (毫秒)
combat_timeout: 5000

# ========================================
# 回血上限（防止回血过多导致无敌）
# ========================================
# 战斗回血上限: 每次回血不超过最大生命的6%
# 相当于5秒回6%, 即每秒1.2%
# 非战斗回血上限: 每次回血不超过最大生命的15%
# 相当于5秒回15%, 即每秒3%

# 战斗回血上限 (最大生命百分比, 0.0-1.0)
max_combat_regen_percent: 0.06

# 非战斗回血上限 (最大生命百分比, 0.0-1.0)
max_normal_regen_percent: 0.15
