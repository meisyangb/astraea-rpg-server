# ========================================
# 伤害计算配置
# ========================================
# 核心战斗数值计算参数
# 调整这些值会改变游戏平衡
#
# 【收益曲线设计】参考暗黑3/流放之路/FF14:
# 所有百分比属性均有硬上限，防止叠加到100%导致机制崩溃
# 数值型属性保持线性（由装备设计自然控制）
# 百分比型属性使用递减曲线或硬上限
# ========================================

# ========================================
# 防御力减伤（递减曲线）
# ========================================
# 减伤率 = 防御力 / (防御力 + defense_divisor)
# 递减特性: 防御越高边际收益越低
# 5000防 ≈ 33%减伤, 10000防 ≈ 50%减伤
# 20000防 ≈ 67%减伤, 40000防 ≈ 80%减伤

defense_divisor: 10000

# ========================================
# 护甲减伤（递减曲线）
# ========================================
# 减伤率 = 护甲% / (护甲% + armor_divisor) × (1 - 有效穿透)
# 递减特性: 护甲越高边际收益越低
# 25%护甲 → 20%减伤, 50%护甲 → 33%减伤
# 85%护甲 → 41%减伤, 100%护甲 → 50%减伤(上限)

armor_divisor: 50

# ========================================
# 闪避/招架上限
# ========================================
# 闪避上限60%: 3次攻击命中2次，足够强但不崩溃
# 招架上限30%: 配合闪避60%，总回避率约72%

# 最大闪避率 (0.0-1.0)
max_dodge: 0.60

# 最大招架率 (0.0-1.0)
max_parry: 0.30

# ========================================
# 减伤上限
# ========================================
# 防御力减伤上限 (0.0-1.0)
max_defense_reduction: 0.90

# 护甲减伤上限 (0.0-1.0)
max_armor_reduction: 0.50

# 额外减伤上限 (0.0-1.0)
# 技能/buff提供的额外减伤不能超过25%
max_bonus_reduction: 0.25

# 总减伤上限 (0.0-1.0)
# 所有减伤叠加后最多减95%，确保至少5%伤害穿透
max_total_reduction: 0.95

# 最小伤害值
# 伤害不会低于此值
min_damage: 1.0

# ========================================
# 暴击系统上限
# ========================================
# 暴击几率上限50%: 一半攻击暴击，足够强但不崩溃
# 暴击伤害下限1.0x: 暴击至少造成等额伤害（不额外加伤）
# 暴击伤害上限3.0x: 防止暴击伤害无限叠加

# 最大暴击几率 (0.0-1.0)
max_crit_chance: 0.50

# 最小暴击伤害倍率
min_crit_damage: 1.0

# 最大暴击伤害倍率
max_crit_damage: 3.0

# ========================================
# 暴击抵抗上限
# ========================================
# 不能让防御方完全抵消暴击，否则暴击属性毫无意义
# 暴击抵抗上限50%, 暴伤抵抗上限50%
# 总暴击减伤上限75%（两者相加不超过75%）

# 最大暴击抵抗 (0.0-1.0)
max_crit_resist: 0.50

# 最大暴伤抵抗 (0.0-1.0)
max_crit_damage_resist: 0.50

# 总暴击减伤上限 (0.0-1.0)
max_total_crit_resist: 0.75

# ========================================
# 吸血平衡上限
# ========================================
# 最大吸血几率 (0.0-1.0)
max_lifesteal_chance: 0.30

# 单次吸血回血上限 (0.0-1.0)
max_lifesteal_health_percent: 0.15

# ========================================
# 反伤平衡上限
# ========================================
# 反伤不应成为主要伤害来源，被动机制上限
# 30%触发 × 20%反弹 = 期望6%反伤

# 最大反伤触发几率 (0.0-1.0)
reflect_max_chance: 0.30

# 最大反伤比例 (0.0-1.0)
reflect_max_ratio: 0.20

# ========================================
# 穿透上限配置
# ========================================
# 穿透100%会导致防御完全失效，因此需要限制上限

# 最大护甲穿透 (0.0-1.0)
max_armor_penetration: 0.70

# 最大防御穿透 (0.0-1.0)
max_defense_penetration: 0.70

# 最大护甲强度 (0.0-1.0)
max_armor_strength: 0.50

# ========================================
# 状态效果配置
# ========================================
burn_duration: 3
scorch_duration: 5
scorch_max_stacks: 3
