# ========================================
# 伤害计算配置
# ========================================
# 核心战斗数值计算参数
# 调整这些值会改变游戏平衡
# 
# 【MMORPG防御公式优化】
# 采用递减曲线防止无限堆防御:
# 减伤率 = 防御力 / (防御力 + defense_divisor)
# 
# 推荐设置 (参考: 暗黑破坏神、流放之路等):
# - defense_divisor: 10000 (防御力更有价值)
# - 10000防御 ≈ 50%减伤
# - 20000防御 ≈ 67%减伤
# - 40000防御 ≈ 80%减伤
# ========================================

# 防御力减伤公式参数
defense_divisor: 10000

# 最小伤害值
# 伤害不会低于此值
min_damage: 1.0

# 最大减伤比例 (0.0-1.0)
# 玩家减伤不能超过这个值,防止无敌
max_damage_reduction: 0.95

# 最大闪避率 (0.0-1.0)
# 玩家闪避不能超过这个值,防止100%闪避
max_dodge: 0.80

# 最大招架率 (0.0-1.0)
# 玩家招架不能超过这个值
max_parry: 0.50

# 最小暴击伤害倍率
# 暴击至少造成多少倍伤害
min_crit_damage: 1.5

# ========================================
# 穿透上限配置 (重要平衡参数)
# ========================================
# 穿透100%会导致防御完全失效，因此需要限制上限
# 防止玩家或BOSS完全无视对方防御

# 最大护甲穿透 (0.0-1.0)
# 护甲穿透超过此值后不再生效
max_armor_penetration: 0.70

# 最大防御穿透 (0.0-1.0)
# 防御穿透超过此值后不再生效
max_defense_penetration: 0.70

# ========================================
# 暴击伤害上限配置
# ========================================
# 防止暴击伤害无限叠加导致伤害爆炸

# 最大暴击伤害倍率
# 暴击伤害超过此值后不再生效
# 例: 3.0 表示暴击最多造成300%伤害
max_crit_damage: 3.0

# ========================================
# 护甲强度配置
# ========================================
# 护甲强度用于抵消敌人的护甲穿透效果
# 计算公式: 有效护甲穿透 = max(0, 攻击者护甲穿透% - 防御者护甲强度%)
# 例如: 攻击者有30%护甲穿透，防御者有10%护甲强度
#       实际穿透效果 = 30% - 10% = 20%
#       防御者的护甲减伤效果只会被削弱20%

# 最大护甲强度 (0.0-1.0)
# 护甲强度不能超过这个值
max_armor_strength: 0.50

# ========================================
# 状态效果配置
# ========================================
# 燃烧效果持续时间（秒）
burn_duration: 3

# 灼烧效果持续时间（秒）
scorch_duration: 5

# 灼烧最大叠加层数
scorch_max_stacks: 3