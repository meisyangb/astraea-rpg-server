# ========================================
# GuangDianNetOpt 配置文件
# RPG服务器静态世界网络优化器
# ========================================
#
# 职责分工：
#   本插件负责：实体AI优化 + 数据包缓存
#   GuangDianDynamicView负责：动态视距 + 区块加载
#
# 适用场景：
#   静态世界的RPG服务器
#   - 预生成的地图（不生成新区块）
#   - 固定的NPC和动物位置
#   - 需要减少CPU和网络带宽
#
# ========================================

# ========================================
# 实体优化配置
# ========================================
# 禁用静态实体的AI计算
# 效果：减少CPU使用 + 减少实体位置更新包
entity:
  # 启用实体优化
  optimization-enabled: true
  
  # 禁用Mob AI感知（mob.setAware(false)）
  # 适用实体：村民、盔甲架、农场动物等
  # 效果：这些实体不再进行AI计算
  disable-mob-ai: true
  
  # 禁用Mob移动
  # 适用实体：盔甲架、村民等完全静止的
  # 效果：静止实体不发送位置更新包
  disable-mob-movement: true
  
  # 禁用Mob看向玩家
  # 效果：减少头部转动更新
  disable-mob-look: true

# ========================================
# 数据包缓存配置
# ========================================
# 缓存静态区块数据包，避免重复发送
packet:
  # 启用数据包缓存
  cache-enabled: true
  
  # 缓存过期时间（秒）
  # 静态世界可以设置较长时间
  cache-expire-seconds: 300

# ========================================
# 说明
# ========================================
# 与GuangDianDynamicView的协作：
#   - DynamicView根据玩家状态（探索/战斗/挂机）调整视距
#   - DynamicView优化区块加载和卸载
#   - 本插件优化静态实体的AI和数据包
#   - 两者分工明确，互不冲突
#
# 与GuangDianParticleBlocker的协作：
#   - ParticleBlocker屏蔽粒子包
#   - 本插件缓存区块数据包
#   - 共同减少网络带宽
#
# ========================================